spring.application.name=pixelworks-api
spring.config.import=optional:file:.env[.properties]
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# La clave JWT se debe configurar en .env (no incluir secretos fijos en el repositorio).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=14400000

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:${DB_EXTERNAL_PORT:5433}}/${DB_NAME:pixelworks_db}
spring.datasource.username=${DB_USER:pixelworks}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/El_Salvador
spring.jackson.time-zone=America/El_Salvador
spring.jackson.locale=es_SV

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
server.compression.enabled=true
